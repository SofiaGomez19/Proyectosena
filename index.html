<script>
    const btnSugerencias = document.getElementById('btnSugerencias');
    const modalSugerencias = document.getElementById('modalSugerencias');
    const closeSugerencias = document.getElementById('closeSugerencias');
    const formSugerencias = document.getElementById('formSugerencias');

    btnSugerencias.addEventListener('click', () => {
        modalSugerencias.classList.add('open');
        modalSugerencias.setAttribute('aria-hidden', 'false');
    });

    closeSugerencias.addEventListener('click', () => {
        modalSugerencias.classList.remove('open');
        modalSugerencias.setAttribute('aria-hidden', 'true');
    });

    modalSugerencias.addEventListener('click', (event) => {
        if (event.target === modalSugerencias) {
            modalSugerencias.classList.remove('open');
            modalSugerencias.setAttribute('aria-hidden', 'true');
        }
    });

</script>
