<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Zybyn Gaming</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;

        .login-contenedor {

            background: #2b2a2a;
            border: 2px solid #ead363;

        }

        h1 {
            margin-bottom: 10px;
            color: #ead363;
            text-align: center;
        }

        .descripcion {
            margin-bottom: 25px;
            color: #ddd;
            text-align: center;
        }

        label {
            display: block;
            margin: 15px 0 6px;
            color: #ead363;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #777;

        button {

    <main class="login-contenedor">

        <form action="iniciosesion.php" method="POST">

    <label for="correo">Correo electrónico</label>

    <label for="contrasena">Contraseña</label>

    <button type="submit">Entrar</button>

</form>
